name: Windows build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.11.1

      - name: Test automatici
        run: python -m pytest -q

      - name: Eseguibile (PyInstaller)
        run: >
          pyinstaller packaging/colorforge_app.py --name ColorForge --noconfirm --windowed
          --paths . --add-data "colorforge/data;colorforge/data"
          --collect-submodules colorforge --collect-submodules skimage
          --exclude-module tkinter --exclude-module matplotlib
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtPdf

      - name: Collaudo dell'eseguibile
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ColorForge\ColorForge.exe" -ArgumentList "--selftest","selftest_out" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Selftest bloccato oltre 5 minuti" }
          if (Test-Path selftest_out\selftest_crash.txt) { Get-Content selftest_out\selftest_crash.txt }
          if (Test-Path selftest_out\selftest_report.json) { Get-Content selftest_out\selftest_report.json }
          if ($p.ExitCode -ne 0) { throw "Selftest fallito: $($p.ExitCode)" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $env:CF_VERSION = "0.1.$env:GITHUB_RUN_NUMBER"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\ColorForge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallito" }
          Compress-Archive -Path dist\ColorForge -DestinationPath "dist\ColorForge-portable-$env:CF_VERSION.zip"
          echo "CF_VERSION=$env:CF_VERSION" >> $env:GITHUB_ENV

      - name: Collaudo dell'installer (installazione silenziosa)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\ColorForge-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$env:RUNNER_TEMP\cfinst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installazione fallita" }
          $q = Start-Process "$env:RUNNER_TEMP\cfinst\ColorForge.exe" -ArgumentList "--selftest","selftest_inst" -PassThru
          if (-not $q.WaitForExit(300000)) { $q.Kill(); throw "Selftest installato bloccato" }
          if ($q.ExitCode -ne 0) { Get-Content selftest_inst\* -ErrorAction SilentlyContinue; throw "Selftest dopo installazione fallito" }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ColorForge-windows
          path: |
            dist/ColorForge-Setup-*.exe
            dist/ColorForge-portable-*.zip
            selftest_out/selftest_report.json
            selftest_out/gui.png

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ColorForge AI ${{ env.CF_VERSION }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Build automatica collaudata su Windows (test automatici + autodiagnosi dell'eseguibile e dell'installer).
            Scarica `ColorForge-Setup-*.exe` e avvialo. Windows SmartScreen potrebbe avvisare perché il file non è firmato: "Ulteriori informazioni" → "Esegui comunque".
          files: |
            dist/ColorForge-Setup-*.exe
            dist/ColorForge-portable-*.zip
